<svg xmlns="http://www.w3.org/2000/svg" width="620" height="160" viewBox="0 0 620 160" role="img" aria-label="Умножение и деление — обратные операции: a умножить на b равно c; c разделить на b равно a, если b не равно нулю"><rect width="620" height="160" fill="#f1f7fc" rx="10"/><g font-family="serif" font-size="29" fill="#243749" text-anchor="middle"><text x="310" y="52">a · b = c</text><text x="310" y="103">c : b = a,   b ≠ 0</text><text x="310" y="143" font-size="17">Умножение и деление — обратные операции</text></g></svg>
